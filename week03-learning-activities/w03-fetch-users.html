<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>W03 - JSONPlaceholder Users</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 500px;
        margin: 2rem auto;
      }
      li {
        margin-bottom: 0.5rem;
      }
    </style>
  </head>
  <body>
    <h1>Users</h1>
    <ul id="user-list"></ul>

    <script>
      const userList = document.getElementById("user-list");

      async function getUsers() {
        try {
          const response = await fetch(
            "https://jsonplaceholder.typicode.com/users",
          );
          if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
          }
          const users = await response.json();
          renderUsers(users);
        } catch (error) {
          console.error("There was a problem fetching the users:", error);
          userList.innerHTML =
            "<li>Sorry, something went wrong loading users.</li>";
        }
      }

      function renderUsers(users) {
        const items = users.map(
          (user) => `<li>${user.name} — ${user.email}</li>`,
        );
        userList.innerHTML = items.join("");
      }

      getUsers();
    </script>
  </body>
</html>
