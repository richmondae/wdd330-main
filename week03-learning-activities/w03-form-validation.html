<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>W03 - Simple Interest Calculator (Form Validation)</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 420px;
        margin: 2rem auto;
      }
      label {
        display: block;
        margin-top: 1rem;
        font-weight: bold;
      }
      input {
        width: 100%;
        padding: 0.5rem;
        box-sizing: border-box;
        border: 2px solid #ccc;
        border-radius: 4px;
      }
      /* only show valid/invalid coloring once the user has interacted with the field */
      input:focus:invalid,
      input.touched:invalid {
        border-color: #d33;
      }
      input:focus:valid,
      input.touched:valid {
        border-color: #2a2;
      }
      .error-message {
        color: #d33;
        font-size: 0.85rem;
        min-height: 1.2em;
      }
      button {
        margin-top: 1.5rem;
        padding: 0.6rem 1.2rem;
        cursor: pointer;
      }
      #result {
        margin-top: 1.5rem;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Simple Interest Calculator</h1>

    <form id="interestForm" novalidate>
      <label for="principal">Principal Amount ($)</label>
      <input
        type="number"
        id="principal"
        name="principal"
        min="0"
        step="0.01"
        required
      />

      <label for="principalConfirm">Confirm Principal Amount ($)</label>
      <input
        type="number"
        id="principalConfirm"
        name="principalConfirm"
        min="0"
        step="0.01"
        required
      />
      <div class="error-message" id="principalError"></div>

      <label for="rate">Annual Interest Rate (%)</label>
      <input type="number" id="rate" name="rate" min="0" step="0.01" required />

      <label for="time">Time (years)</label>
      <input type="number" id="time" name="time" min="0" step="0.01" required />

      <button type="submit">Calculate</button>
    </form>

    <p id="result"></p>

    <script>
      const form = document.getElementById("interestForm");
      const principal = document.getElementById("principal");
      const principalConfirm = document.getElementById("principalConfirm");
      const rate = document.getElementById("rate");
      const time = document.getElementById("time");
      const principalError = document.getElementById("principalError");
      const result = document.getElementById("result");

      // mark a field "touched" once the user leaves it, so :invalid styling
      // doesn't show red before they've had a chance to type anything
      [principal, principalConfirm, rate, time].forEach((input) => {
        input.addEventListener("blur", () => input.classList.add("touched"));
      });

      // immediately check that the two principal fields match
      function checkPrincipalsMatch() {
        if (
          principalConfirm.value !== "" &&
          principal.value !== principalConfirm.value
        ) {
          principalError.textContent =
            "Principal amounts do not match. Please re-enter.";
          principalConfirm.setCustomValidity("Principal amounts do not match.");
          return false;
        }
        principalError.textContent = "";
        principalConfirm.setCustomValidity("");
        return true;
      }

      principal.addEventListener("input", checkPrincipalsMatch);
      principalConfirm.addEventListener("input", checkPrincipalsMatch);

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        result.textContent = "";

        // built-in HTML5 validation (required, min, etc.)
        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        if (!checkPrincipalsMatch()) {
          principalConfirm.value = "";
          principalConfirm.focus();
          return;
        }

        const p = parseFloat(principal.value);
        const r = parseFloat(rate.value);
        const t = parseFloat(time.value);

        // guard against NaN in case something slipped through
        if (Number.isNaN(p) || Number.isNaN(r) || Number.isNaN(t)) {
          result.textContent = "Please enter valid numbers for all fields.";
          return;
        }

        const interest = (p * r * t) / 100;
        const total = p + interest;

        result.textContent = `Interest: $${interest.toFixed(2)} | Total: $${total.toFixed(2)}`;
      });
    </script>
  </body>
</html>
