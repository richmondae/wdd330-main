<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Home</title>
    <link rel="stylesheet" href="./css/style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />

    <link rel="shortcut icon" href="./images/favicon.ico" type="image/x-icon" />

    <script src="./js/main.js" type="module"></script>
  </head>

  <body>
    <header id="header"></header>

    <main>
      <section class="hero">
        <div class="hero__image-wrapper">
          <img
            src="./images/hero-bg.avif"
            alt="Camper van in mountain landscape"
          />
        </div>
      </section>

      <section class="categories">
        <ul class="category-list">
          <li>
            <a
              href="/product_listing/index.html?category=tents"
              class="category-card"
            >
              <svg
                viewBox="0 0 64 64"
                class="category-card__icon"
                aria-hidden="true"
              >
                <path
                  d="M32 10 L58 54 H6 Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="3"
                  stroke-linejoin="round"
                />
                <path
                  d="M32 10 V54"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="3"
                />
                <path
                  d="M20 54 L32 30 L44 54"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="3"
                  stroke-linejoin="round"
                />
              </svg>
              <span>Tents</span>
            </a>
          </li>
          <li>
            <a
              href="/product_listing/index.html?category=backpacks"
              class="category-card"
            >
              <svg
                viewBox="0 0 64 64"
                class="category-card__icon"
                aria-hidden="true"
              >
                <rect
                  x="16"
                  y="20"
                  width="32"
                  height="34"
                  rx="8"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="3"
                />
                <path
                  d="M24 20 V14 a8 8 0 0 1 16 0 v6"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="3"
                />
                <rect
                  x="24"
                  y="28"
                  width="16"
                  height="10"
                  rx="2"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="3"
                />
                <line
                  x1="16"
                  y1="42"
                  x2="48"
                  y2="42"
                  stroke="currentColor"
                  stroke-width="3"
                />
              </svg>
              <span>Backpacks</span>
            </a>
          </li>
          <li>
            <a
              href="/product_listing/index.html?category=sleeping-bags"
              class="category-card"
            >
              <svg
                viewBox="0 0 64 64"
                class="category-card__icon"
                aria-hidden="true"
              >
                <path
                  d="M22 12 h20 a6 6 0 0 1 6 6 v28 a6 6 0 0 1 -6 6 h-14 l-8 -8 v-26 a6 6 0 0 1 2 -6 Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="3"
                  stroke-linejoin="round"
                />
                <line
                  x1="22"
                  y1="22"
                  x2="48"
                  y2="22"
                  stroke="currentColor"
                  stroke-width="2.5"
                />
                <line
                  x1="22"
                  y1="32"
                  x2="48"
                  y2="32"
                  stroke="currentColor"
                  stroke-width="2.5"
                />
              </svg>
              <span>Sleeping Bags</span>
            </a>
          </li>
          <li>
            <a
              href="/product_listing/index.html?category=hammocks"
              class="category-card"
            >
              <svg
                viewBox="0 0 64 64"
                class="category-card__icon"
                aria-hidden="true"
              >
                <line
                  x1="8"
                  y1="14"
                  x2="8"
                  y2="50"
                  stroke="currentColor"
                  stroke-width="3"
                  stroke-linecap="round"
                />
                <line
                  x1="56"
                  y1="14"
                  x2="56"
                  y2="50"
                  stroke="currentColor"
                  stroke-width="3"
                  stroke-linecap="round"
                />
                <path
                  d="M8 30 Q32 48 56 30"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="3"
                  stroke-linecap="round"
                />
              </svg>
              <span>Hammocks</span>
            </a>
          </li>
        </ul>
      </section>

      <section class="mission">
        <h1>
          Our mission is to provide you with everything you need to sleep
          outside comfortably at an affordable price.
        </h1>
      </section>

      <section class="products">
        <h2>Top Products</h2>
        <ul class="product-list"></ul>
      </section>
    </main>

    <footer id="footer"></footer>
  </body>
</html>
