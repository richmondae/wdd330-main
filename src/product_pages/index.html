<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Product Details</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link
      rel="shortcut icon"
      href="../images/favicon.ico"
      type="image/x-icon"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />

    <script src="../js/productDetail.js" type="module"></script>
  </head>

  <body>
    <header id="header"></header>

    <main>
      <section class="product-detail">
        <div class="product-detail__media">
          <div class="product-detail__image-outline">
            <div class="product-detail__image-bg">
              <img
                id="productImage"
                src=""
                alt=""
                class="product-detail__image"
              />
            </div>
          </div>
        </div>

        <div class="product-detail__info">
          <div class="product-detail__meta">
            <span class="card__brand" id="productBrand"></span>
            <span class="product__color-badge" id="productColor"></span>
          </div>

          <h1 class="product__title" id="productName"></h1>
          <p class="product__price" id="productPrice"></p>

          <p class="product__description" id="productDescription"></p>

          <div class="product-detail__action">
            <button id="addToCart" data-id="">Add to Cart</button>
          </div>
        </div>
      </section>
    </main>

    <footer id="footer"></footer>
  </body>
</html>
